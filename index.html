<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hamester Run</title>
    <meta
      name="description"
      content="Run, dodge obstacles, and collect food in Hamester Run — a lane runner in your browser."
    />
    <link rel="icon" type="image/png" href="./art/thumbnail.png" />
    <link rel="apple-touch-icon" href="./art/thumbnail.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hamester Run" />
    <meta
      property="og:description"
      content="Run, dodge obstacles, and collect food in Hamester Run — a lane runner in your browser."
    />
    <meta property="og:image" content="./art/thumbnail.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hamester Run" />
    <meta
      name="twitter:description"
      content="Run, dodge obstacles, and collect food in Hamester Run — a lane runner in your browser."
    />
    <meta name="twitter:image" content="./art/thumbnail.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Optional: place bgm.mp3 next to this HTML (or art/bgm.mp3). Loops during play. -->
    <audio id="gameBgm" preload="auto" playsinline loop>
      <source src="./bgm.mp3" type="audio/mpeg" />
      <source src="./art/bgm.mp3" type="audio/mpeg" />
      <source src="./bgm.ogg" type="audio/ogg" />
      <source src="./art/bgm.ogg" type="audio/ogg" />
    </audio>

    <div
      id="nameModal"
      class="modal-overlay modal-overlay--welcome hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="nameModalTitle"
    >
      <div class="modal-card--welcome">
        <div class="welcome-header">
          <h2 id="nameModalTitle" class="welcome-title">Welcome</h2>
        </div>
        <div class="welcome-frost">
          <p class="welcome-hint">Put in your name.</p>
          <input
            id="playerNameInput"
            class="welcome-input"
            type="text"
            maxlength="24"
            placeholder="Name"
            autocomplete="nickname"
            aria-label="Player name"
          />
          <button type="button" id="startGameBtn" class="welcome-play-btn">Play</button>
        </div>
      </div>
    </div>

    <div
      id="gameOverModal"
      class="modal-overlay modal-overlay--gameover hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="gameOverTitle"
    >
      <div
        id="gameOverShareCard"
        class="modal-card--welcome modal-card--gameover-sheet"
      >
        <div class="welcome-header">
          <h2 id="gameOverTitle" class="welcome-title">Your Best Scores</h2>
        </div>
        <div class="welcome-frost">
          <div class="leaderboard-scroll leaderboard-scroll--modal">
            <table class="leaderboard-table--modal" aria-label="Your best scores">
              <thead>
                <tr>
                  <th scope="col">Date</th>
                  <th scope="col">Player name</th>
                  <th scope="col">Score</th>
                  <th scope="col">Time</th>
                </tr>
              </thead>
              <tbody id="leaderboardBodyGameOver"></tbody>
            </table>
          </div>
          <div class="gameover-actions" role="group" aria-label="Save leaderboard">
            <button type="button" id="saveLeaderboardBtn" class="gameover-action-btn">
              Save image
            </button>
          </div>
          <button type="button" id="tryAgainBtn" class="welcome-play-btn">Try again</button>
        </div>
      </div>
    </div>

    <div class="wrap">
      <div class="layout-mid">
        <div class="center-col">
          <div class="frame">
            <canvas id="gameCanvas" width="420" height="720"></canvas>

            <div class="frame-top-ui" aria-hidden="false">
              <div class="play-hud">
                <div class="play-hud__title-row">
                  <span class="play-hud__title">Hamester Run</span>
                  <button
                    type="button"
                    id="pauseToggleBtn"
                    class="play-hud__pause-btn"
                    aria-label="Pause game"
                  >
                    Pause
                  </button>
                </div>
                <div class="play-hud__stage-goal-line">
                  <span id="goalStageLabel" class="play-hud__stage-part">Stage 1</span>
                  <span id="hudSepBeforeGoal" class="play-hud__mid-dot" aria-hidden="true">·</span>
                  <span id="hudGoalPart" class="play-hud__goal-part">
                    <span class="play-hud__goal-label">Goal</span>
                    <span id="goalText" class="play-hud__goal-text">0 / 10</span>
                  </span>
                  <span id="hudSepBeforeHearts" class="play-hud__mid-dot" aria-hidden="true">·</span>
                  <div class="play-hud__hearts" aria-label="Hearts">
                    <span class="play-hud__hearts-icon" aria-hidden="true">♥</span>
                    <span id="heartsValue" class="play-hud__hearts-value">5/5</span>
                  </div>
                </div>
                <div id="goalMeterWrap" class="play-hud__meter" aria-hidden="true">
                  <div id="goalFill" class="play-hud__meter-fill" style="width: 0%"></div>
                </div>
              </div>
              <div id="banner" class="play-banner hidden" role="status" aria-live="polite"></div>
            </div>

            <div class="lane-guides" aria-hidden="true">
              <div class="lane-guides__half lane-guides__half--left">
                <svg
                  class="lane-guides__chevron"
                  viewBox="0 0 48 120"
                  width="40"
                  height="100"
                  focusable="false"
                >
                  <path
                    d="M 32 12 L 12 60 L 32 108"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
              <div class="lane-guides__half lane-guides__half--right">
                <svg
                  class="lane-guides__chevron"
                  viewBox="0 0 48 120"
                  width="40"
                  height="100"
                  focusable="false"
                >
                  <path
                    d="M 16 12 L 36 60 L 16 108"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>

      <footer class="game-credit" role="contentinfo">
        <a
          class="game-credit__linkedin"
          href="https://www.linkedin.com/in/juny-chen-4b6a6424/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Juny Chen on LinkedIn"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path
              fill="currentColor"
              d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"
            />
          </svg>
        </a>
        <span class="game-credit__text">This game is developed by Juny Chen</span>
      </footer>
    </div>

    <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js" crossorigin="anonymous"></script>
    <script src="./game.js"></script>
  </body>
</html>
